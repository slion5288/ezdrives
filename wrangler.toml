# EZDRIVES — Cloudflare Pages + D1 configuration
# Pages static assets in dist/ (build output), API in functions/, D1 in migrations/.

name = "ezdrives"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "ezdrives-db"
database_id = "5fcae10e-7f1b-4457-927a-42f34ac249a5"
migrations_dir = "migrations"

# § Cron: lesson reminders every 30 min + daily schedule at 07:00 America/Toronto.
# The handler lives in functions/cron.js (onRequestSchedule). NOTE: Pages cron
# triggers are registered in the Cloudflare DASHBOARD (Pages → ezdrives →
# Settings → Cron Triggers) — this block documents the schedule for `pages dev`
# and is NOT applied by pages-action CI deploys.
[triggers]
crons = ["*/30 * * * *", "0 7 * * *"]

# Cloudflare Email Sending (Workers Paid). PRODUCTION SEND PATH = REST API:
#   env vars CLOUDFLARE_EMAIL_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Pages secrets).
#   Pages Functions do NOT support the send_email Workers binding; this binding
#   only provides env.EMAIL.send for `wrangler pages dev` (local dev stub).
# Until the env vars are set, the notification service logs FAILED and
# business flow is never blocked.
[[send_email]]
name = "EMAIL"
