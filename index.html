    <title>EZDRIVES · Driving Lessons</title>
    <script>
      // §: www → apex redirect (the apex is canonical). The www hostname still
      // needs a DNS record in the Cloudflare dashboard; once it resolves this
      // script sends every www visitor to https://ezdrives.net.
      (function () {
        try {
          if (window.location.protocol === 'file:') return
          if (window.location.hostname === 'www.ezdrives.net') {
            window.location.replace(
              'https://ezdrives.net' + window.location.pathname + window.location.search + window.location.hash,
            )
          }
        } catch (e) {
          /* ignore */
        }
      })()
      // HashRouter deep-link support: a path like /login (no hash) is served by
      // the SPA fallback — rewrite it to /#/login so direct links land on the
      // right page instead of the home route.
      (function () {
        try {
          // Skip on file:// — the offline Preview.html must open as-is (its
          // pathname is a filesystem path, not a route).
          if (window.location.protocol === 'file:') return
          var p = window.location.pathname
          if (p !== '/' && !window.location.hash) {
            window.location.replace('/#' + p + window.location.search)
          }
        } catch (e) {
          /* ignore — keep current URL */
        }
      })()
    </script>
